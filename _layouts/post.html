---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<p class="post-nav">
  <a href="{{ '/' | relative_url }}">&larr; All posts</a>
</p>
